---

- name: Install Redis packages
  package:
    name: "{{ redis_server_packages }}"
    state: present

- name: Ensure Redis own his data directory
  file:
    path: "{{ redis_datadir }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"

- name: Deploy "{{ redis_config }}"
  template:
    src: redis.conf.j2
    dest: "{{ redis_config }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0640'
  notify: Restart Redis Service

- name: Enable service Redis
  service:
    name: "{{ redis_service_name }}"
    enabled: yes
    state: started

- name: Install Redis Sentinel packages
  package:
    name: "{{ redis_sentinel_packages }}"
    state: present

- name: Deploy "{{ redis_sentinel_config }}"
  template:
    src: sentinel.conf.j2
    dest: "{{ redis_sentinel_config }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0640'
  notify: Restart Sentinel Service
