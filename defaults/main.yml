---

redis_service_name: "redis-server"
redis_server_packages: [
  redis-server
  ]
redis_datadir: "/var/lib/redis"
redis_user: "redis"
redis_group: "redis"
redis_config: "/etc/redis/redis.conf"

redis_config_redis_port: "6379"

redis_config_appendonly: "yes"
redis_config_appendfilename: "appendonly.aof"
redis_config_appendfsync: "everysec"
redis_config_save:
  - "900 1"
  - "300 10"
  - "60 10000"

redis_sentinel_packages: [
  redis-sentinel
  ]

redis_config_sentinel_port: "26379"
redis_sentinel_config: "/etc/redis/sentinel.conf"
redis_sentinel_service_name: "redis-sentinel"
redis_sentinel_master_name: "mymaster"
redis_sentinel_quorum: "2"
